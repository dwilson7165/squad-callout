<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Squad Callout Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one tactical column &mdash; HUD strip, radar field, comms console below. Single committed dark "night-ops" look. */
:root {
  color-scheme: dark;
  --ground: #0f1519;
  --panel: #161f25;
  --line: #26343d;
  --grid: #1c2830;
  --ink: #e4ebe8;
  --muted: #8b9ea4;
  --amber: #f0a83a;
  --teal: #4fc2b4;
  --hostile: #e8625a;
  --locked: #6d4a4a;
  --good: #6fcf8a;
  --display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ground); color: var(--ink); }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 16px 32px; padding-inline: 16px; display: flex; flex-direction: column; gap: 12px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: .04em; text-transform: uppercase; margin: 0; line-height: 1; }
h1 span { color: var(--amber); }
.tag { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.hud { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.hp { display: flex; align-items: center; gap: 8px; min-width: 0; }
.hp-bar { flex: 1; height: 8px; background: var(--grid); border-radius: 4px; overflow: hidden; }
.hp-fill { height: 100%; width: 100%; background: var(--good); transition: width .2s, background .2s; }
.hud b { color: var(--amber); font-weight: 500; }
.field { position: relative; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--ground); }
canvas { display: block; width: 100%; touch-action: manipulation; cursor: crosshair; }
.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: color-mix(in srgb, var(--ground) 78%, transparent); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; max-width: 400px; width: 100%; display: flex; flex-direction: column; gap: 10px; max-height: 100%; overflow-y: auto; }
.card h2 { font-family: var(--display); font-size: 24px; text-transform: uppercase; letter-spacing: .05em; margin: 0; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); font-size: 14px; }
.card p strong { color: var(--ink); font-weight: 600; }
.example { font-family: var(--mono); color: var(--amber); font-size: 14px; }
.grade { font-family: var(--display); font-size: 64px; font-weight: 800; line-height: 1; color: var(--amber); }
.stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; font-size: 14px; font-variant-numeric: tabular-nums; }
.stats dt { color: var(--muted); }
.stats dd { margin: 0; font-family: var(--mono); text-align: right; }
.tip { border-left: 3px solid var(--amber); padding-left: 10px; color: var(--ink) !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.primary { background: var(--amber); color: #1a1206; border: 0; border-radius: 8px; padding: 12px 16px; font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; }
.heard { font-family: var(--mono); font-size: 13px; color: var(--muted); min-height: 1.4em; overflow-wrap: anywhere; }
.heard em { color: var(--amber); font-style: normal; }
.console { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: stretch; }
.talk { width: 92px; min-height: 92px; border-radius: 50%; border: 2px solid var(--amber); background: transparent; font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: .1em; color: var(--amber); user-select: none; -webkit-user-select: none; touch-action: none; align-self: center; }
.talk.live { background: var(--amber); color: #1a1206; }
.talk:disabled { opacity: .35; cursor: not-allowed; }
.side { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mic-status { font-size: 12px; color: var(--muted); }
form { display: flex; gap: 8px; }
input[type=text] { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); padding: 10px 12px; font-family: var(--mono); font-size: 14px; }
.send { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 0 14px; }
.pad { display: flex; flex-direction: column; gap: 6px; }
.pad-label { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 4px; font-family: var(--display); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 15px; }
.chip[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.log { list-style: none; margin: 0; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; font-family: var(--mono); font-size: 13px; display: flex; flex-direction: column; gap: 4px; min-height: 120px; }
.log li { overflow-wrap: anywhere; }
.log .who { display: inline-block; min-width: 4.5em; letter-spacing: .06em; }
.log .you .who { color: var(--amber); }
.log .bot .who { color: var(--teal); }
.log .sys .who { color: var(--hostile); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
@media (max-width: 420px) { .talk { width: 78px; min-height: 78px; font-size: 15px; } h1 { font-size: 26px; } }
@media (prefers-reduced-motion: reduce) { .hp-fill { transition: none; } }
.roster { font-size: 13px; color: var(--muted); }
.roster b { color: var(--teal); font-family: var(--display); letter-spacing: .08em; font-size: 15px; }
.talk.on { background: var(--amber); color: #1a1206; }
.talk.busy { border-style: dashed; }
.log .coach .who { color: var(--good); }
.diff { display: flex; flex-direction: column; gap: 6px; }
.diff-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.diff-note { font-size: 13px !important; min-height: 1.4em; }
.hud { grid-template-columns: 1fr auto auto auto; }
.pause-btn { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-family: var(--display); font-weight: 700; letter-spacing: .08em; font-size: 14px; }
.pause-btn:disabled { opacity: .4; cursor: default; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn-row .primary { flex: 1 1 160px; }
.secondary { flex: 1 1 140px; background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 11px 14px; font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: .08em; text-transform: uppercase; }
.save-note { font-family: var(--mono); font-size: 12px !important; color: var(--muted); }
.row4 { grid-template-columns: repeat(4, 1fr) !important; }
</style>

<div class="wrap">
  <header>
    <h1>Squad <span>Callout</span></h1>
    <div class="tag">Drill &middot; prototype 0.8</div>
  </header>

  <div class="hud" aria-live="polite">
    <div class="hp"><span>HP</span><div class="hp-bar"><div class="hp-fill" id="hpFill"></div></div></div>
    <div>WAVE <b id="waveOut">1/6</b></div>
    <div>PTS <b id="scoreOut">0</b></div>
    <button class="pause-btn" id="pauseBtn" type="button" aria-label="Pause" disabled>II</button>
  </div>

  <div class="field">
    <canvas id="cv" aria-label="Top-down drill field. Enemies appear in the left, front and right sectors."></canvas>
    <div class="overlay" id="overlay">
      <div class="card" id="card"></div>
    </div>
  </div>

  <div class="legend">
    <span><i style="background:var(--locked)"></i>Locked enemy</span>
    <span><i style="background:var(--hostile)"></i>Unlocked</span>
    <span><i style="background:var(--teal)"></i>Squad</span>
    <span><i style="background:var(--amber)"></i>You</span>
  </div>
  <div class="roster">Squad: <b>ACE</b> holds left &middot; <b>COLE</b> holds front &middot; <b>BRICK</b> holds right. Say a name to reassign them.</div>

  <div class="heard" id="heard">Heard: &mdash;</div>

  <div class="console">
    <button class="talk" id="talkBtn" type="button" aria-pressed="false" aria-label="Microphone on or off">MIC<br>OFF</button>
    <div class="side">
      <div class="mic-status" id="micStatus">Tap MIC once. It stays open until you tap it again.</div>
      <form id="typeForm">
        <input type="text" id="typeIn" placeholder="or type: two left, one shot right" autocomplete="off" aria-label="Type a callout">
        <button class="send" type="submit">Call</button>
      </form>
      <label class="toggle"><input type="checkbox" id="voiceToggle" checked> Squad talks back</label>
    </div>
  </div>

  <div class="pad" aria-label="Callout pad">
    <div class="pad-label">Callout pad &middot; pick a count or one shot, then a sector</div>
    <div class="row row4">
      <button class="chip" type="button" data-count="one" aria-pressed="false">One</button>
      <button class="chip" type="button" data-count="two" aria-pressed="true">Two</button>
      <button class="chip" type="button" data-count="three" aria-pressed="false">Three</button>
      <button class="chip" type="button" data-count="oneshot" aria-pressed="false">1 Shot</button>
    </div>
    <div class="row">
      <button class="chip" type="button" data-zone="left">Left</button>
      <button class="chip" type="button" data-zone="front">Front</button>
      <button class="chip" type="button" data-zone="right">Right</button>
    </div>
  </div>

  <ul class="log" id="log" aria-live="polite"></ul>
</div>

<script>
(() => {
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const C = { ground: css('--ground'), grid: css('--grid'), line: css('--line'), ink: css('--ink'), muted: css('--muted'), amber: css('--amber'), teal: css('--teal'), hostile: css('--hostile'), locked: css('--locked'), good: css('--good'), panel: css('--panel') };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- setup ----------
  const WAVES = 6;
  const MAX_HP = 3;
  const ZONES = {
    left:  { x0: .06, x1: .30, y0: .16, y1: .56, label: 'LEFT',  post: { x: .30, y: .66 } },
    front: { x0: .37, x1: .63, y0: .08, y1: .32, label: 'FRONT', post: { x: .50, y: .52 } },
    right: { x0: .70, x1: .94, y0: .16, y1: .56, label: 'RIGHT', post: { x: .70, y: .66 } }
  };
  const DIFFS = {
    recruit: { label: 'Recruit', note: 'Slower enemies, lighter hits, longer to heal. Learn the calls.', dmg: 2, first: [5, 6.5], gap: [5, 7], max: 2, heal: 8, tough: .12 },
    regular: { label: 'Regular', note: 'Standard pace.', dmg: 3, first: [3.5, 5], gap: [3.5, 6], max: 2, heal: 6.5, tough: .2 },
    veteran: { label: 'Veteran', note: 'Faster shots, quicker heals, up to three contacts at once.', dmg: 3, first: [2.5, 3.5], gap: [2.5, 4.5], max: 3, heal: 5, tough: .3 }
  };
  let diffKey = 'regular';
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  if (DIFFS[store.get('squadcallout.diff')]) diffKey = store.get('squadcallout.diff');
  let D = DIFFS[diffKey];
  const PLAYER = { x: .5, y: .88 };
  const COVER = [[.14,.62,.1,.04],[.76,.62,.1,.04],[.44,.40,.12,.035],[.30,.30,.05,.08],[.65,.30,.05,.08]];

  // ---------- squad ----------
  const bots = [
    { id: 'ace',   name: 'Ace',   zone: 'left',  home: { x: .31, y: .84 }, pitch: 1.15 },
    { id: 'cole',  name: 'Cole',  zone: 'front', home: { x: .50, y: .72 }, pitch: 0.95 },
    { id: 'brick', name: 'Brick', zone: 'right', home: { x: .69, y: .84 }, pitch: 0.75 }
  ];
  const botById = id => bots.find(b => b.id === id);

  // ---------- parser (pure) ----------
  // Includes common speech-recognition mishearings ("Lyft" for left, "write" for right, "tree" for three).
  const NAMES = { ace: 'ace', ase: 'ace', aice: 'ace', aces: 'ace', ice: 'ace', cole: 'cole', coal: 'cole', kohl: 'cole', col: 'cole', coll: 'cole', koal: 'cole', call: 'cole', cold: 'cole', brick: 'brick', bric: 'brick', brik: 'brick', bricks: 'brick', rick: 'brick', brig: 'brick' };
  const NUM = { one:1, won:1, single:1, solo:1, '1':1, two:2, couple:2, pair:2, '2':2, tue:2, three:3, tree:3, free:3, '3':3, four:4, '4':4, multiple:'many', several:'many', group:'many', many:'many' };
  const ZONE_WORDS = { left:'left', lift:'left', lyft:'left', lef:'left', leff:'left', laughed:'left', lefts:'left', right:'right', write:'right', rite:'right', wright:'right', riot:'right', rights:'right', bright:'right', front:'front', fronts:'front', frunt:'front', ahead:'front', forward:'front', center:'front', centre:'front', middle:'front', top:'front', north:'front' };
  const SEPS = new Set(['and', 'then', 'also', 'plus', 'next']);
  const ACTION_RE = /\b(engag\w*|gauging|push\w*|flank\w*|attack\w*|rush\w*|fir(e|ing)|shoot\w*|taking|take)\b/;
  const CONTACT_RE = /\b(contact|contacts|enemy|enemies|hostile|hostiles|tango|tangos)\b/;
  // "One shot" and the slang players use for an enemy at 1 HP.
  const ONESHOT_RE = /\b(one|1|won|want|wan) ?(shots?|shut|shop|shout|shoot)\b|\boneshot\b|\bcracked\b|\blit\b|\bweak\b|\blow\b|\bone hp\b|\bfinish (him|them|it)\b/;

  function isCountAt(words, i) {
    const w = words[i];
    if (w === 'one' || w === '1' || w === 'won' || w === 'want' || w === 'wan') { if (/^(shots?|shut|shop|shout|shoot)$/.test(words[i + 1] || '')) return false; }
    if (NUM[w] !== undefined) return true;
    return (w === 'to' || w === 'too') && !!ZONE_WORDS[words[i + 1]];
  }
  function splitSegments(text) {
    const words = String(text || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(Boolean);
    const segs = []; let cur = [], hasZone = false, hasName = false;
    const flush = () => { if (cur.length) segs.push(cur); cur = []; hasZone = false; hasName = false; };
    words.forEach((w, i) => {
      if (SEPS.has(w)) { flush(); return; }
      const shotStart = /^(one|1|won|want|wan)$/.test(w) && /^(shots?|shut|shop|shout|shoot)$/.test(words[i + 1] || '');
      const isName = !!NAMES[w], isCount = isCountAt(words, i) || shotStart, isZone = !!ZONE_WORDS[w];
      if (cur.length && ((isName && (hasZone || hasName)) || (isCount && hasZone) || (isZone && hasZone))) flush();
      cur.push(w);
      if (isZone) hasZone = true;
      if (isName) hasName = true;
    });
    flush();
    return segs;
  }
  function parseSegment(words) {
    const text = words.join(' ');
    const oneShot = ONESHOT_RE.test(text);
    let name = null, zone = null, count = null;
    words.forEach((w, i) => {
      if (!name && NAMES[w]) name = NAMES[w];
      if (!zone && ZONE_WORDS[w]) zone = ZONE_WORDS[w];
      if (!oneShot && count === null && NUM[w] !== undefined) count = NUM[w];
      if (!oneShot && count === null && (w === 'to' || w === 'too') && ZONE_WORDS[words[i + 1]]) count = 2;
    });
    const a = text.match(ACTION_RE);
    let command = null;
    if (/\b(cover me|on me|regroup|fall back|back to me)\b/.test(text)) command = 'regroup';
    else if (/\bhold\b/.test(text)) command = 'hold';
    else if (/\breload/.test(text)) command = 'reload';
    else if (/\b(status|sitrep)\b/.test(text)) command = 'status';
    else if (/\b(copy|roger|copied)\b/.test(text)) command = 'copy';
    return { name, zone, count, action: a && !oneShot ? a[1] : null, command, contact: CONTACT_RE.test(text), oneShot, text };
  }
  function parseUtterance(raw) {
    const out = [];
    splitSegments(raw).map(parseSegment).forEach(p => {
      const prev = out[out.length - 1];
      // "left, one shot" -> one call: a sector followed by a bare one-shot.
      if (prev && p.oneShot && !p.zone && !p.name && prev.zone && prev.count === null && !prev.oneShot) { prev.oneShot = true; prev.text += ' ' + p.text; return; }
      // "one shot front, Brick" -> the trailing name owns the previous call.
      if (prev && p.name && !p.zone && !p.oneShot && p.count === null && !p.command && !p.action && !prev.name) { prev.name = p.name; prev.text += ' ' + p.text; return; }
      out.push(p);
    });
    return out;
  }
  window.parseUtterance = parseUtterance;

  // ---------- state ----------
  let S = null;
  const newStats = () => ({ callouts: [], missedCombo: 0, lockedShots: 0, wrong: 0, unclear: 0, vague: 0, multi: 0, named: 0, groupsTotal: 0, groupsCalled: 0, kills: 0, oneShotCalls: 0, oneShotEscapes: 0, oneShotSeen: 0, wavesPlayed: 0 });
  function freshState(from) {
    bots.forEach(b => { b.x = b.home.x; b.y = b.home.y; b.cd = 0; b.task = null; b.mode = 'home'; b.flash = -9; });
    return { running: false, paused: false, over: false, won: false, t: 0, hp: from ? from.hp : 100, score: from ? from.score : 0,
      wave: 0, toSpawn: 0, phase: 'brief', phaseEnd: 0, banner: '', bannerAt: -9, groups: [], shots: [], flashes: [], sparks: [], nextSpawn: 0,
      taughtOneShot: false, stats: from ? from.stats : newStats() };
  }
  const SAVE_KEY = 'squadcallout.save';
  function saveGame() {
    store.set(SAVE_KEY, JSON.stringify({ v: 1, diff: diffKey, wave: S.wave, hp: S.hp, score: S.score, stats: S.stats, at: Date.now() }));
  }
  function loadSave() {
    try { const s = JSON.parse(store.get(SAVE_KEY) || 'null'); return s && s.v === 1 && DIFFS[s.diff] && s.wave >= 1 && s.wave <= WAVES ? s : null; } catch (e) { return null; }
  }

  function startWave(n) {
    S.wave = n; S.toSpawn = 3 + n; S.stats.wavesPlayed = Math.max(S.stats.wavesPlayed || 0, n); S.phase = 'intermission'; S.phaseEnd = S.t + (n === 1 ? 2 : 3.5);
    S.banner = `WAVE ${n}`; S.bannerAt = S.t;
    saveGame();
    log('sys', 'SYS', `Wave ${n} of ${WAVES}: ${S.toSpawn} contacts incoming. Progress saved.`);
  }
  function spawnGroup() {
    const busy = new Set(S.groups.filter(g => g.enemies.length).map(g => g.zone));
    const free = Object.keys(ZONES).filter(z => !busy.has(z));
    if (!free.length) return false;
    const zone = free[Math.floor(Math.random() * free.length)];
    const count = 1 + Math.floor(Math.random() * 3);
    const Z = ZONES[zone], enemies = [];
    const toughP = Math.min(.45, D.tough + .03 * (S.wave - 1));
    for (let i = 0; i < count; i++) {
      let p, tries = 0;
      do { p = { x: rand(Z.x0 + .03, Z.x1 - .03), y: rand(Z.y0 + .04, Z.y1 - .03) }; tries++; }
      while (tries < 20 && enemies.some(e => Math.hypot(e.x - p.x, e.y - p.y) < .08));
      enemies.push({ x: p.x, y: p.y, hp: MAX_HP, tough: Math.random() < toughP, ducked: false, duckAt: 0, hitAt: -9, fireCd: rand(D.first[0], D.first[1]) });
    }
    S.groups.push({ zone, count, spawnT: S.t, called: false, warned: false, enemies });
    S.stats.groupsTotal++;
    return true;
  }

  // ---------- comms out ----------
  const logEl = document.getElementById('log');
  function log(kind, who, msg) {
    const li = document.createElement('li');
    li.className = kind;
    const w = document.createElement('span'); w.className = 'who'; w.textContent = who;
    li.append(w, ' ' + msg);
    logEl.prepend(li);
    while (logEl.children.length > 7) logEl.lastChild.remove();
  }
  const voiceToggle = document.getElementById('voiceToggle');
  // Squad voice. A new reply cuts off the one playing (barge-in), and the mic keeps listening the whole time.
  const recentSpoken = [];
  const normWords = t => String(t || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(Boolean);
  const nativeTTS = () => { const Cap = window.Capacitor; return Cap && Cap.isNativePlatform && Cap.isNativePlatform() && Cap.Plugins && Cap.Plugins.TextToSpeech; };
  function speakNow(line, pitch) {
    recentSpoken.push({ words: normWords(line), at: Date.now() });
    while (recentSpoken.length > 6) recentSpoken.shift();
    const TTS = nativeTTS();
    if (TTS) { TTS.stop().catch(() => {}).then(() => TTS.speak({ text: line, lang: 'en-US', rate: 1.25, pitch }).catch(() => {})); return; }
    if (!('speechSynthesis' in window)) return;
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(line); u.rate = 1.25; u.pitch = pitch; speechSynthesis.speak(u); } catch (e) {}
  }
  // True when the mic most likely picked up the squad's own reply from the speaker.

    // wave pips
    if (S && S.wave) {
      c.font = '600 11px "IBM Plex Mono", monospace'; c.textAlign = 'left'; c.fillStyle = C.muted;
      c.fillText(`WAVE ${S.wave}/${WAVES}`, 10, 18);
      for (let i = 0; i < WAVES; i++) {
        c.fillStyle = i < S.wave - 1 ? C.good : i === S.wave - 1 ? C.amber : alpha(C.muted, .3);
        roundRect(10 + i * 14, 25, 10, 4, 2); c.fill();
      }
    }
    // incoming counter
    if (S && S.running) {
      const incoming = S.toSpawn + S.groups.filter(live).length;
      c.font = '500 11px "IBM Plex Mono", monospace'; c.textAlign = 'right'; c.fillStyle = C.muted;
      c.fillText(`CONTACTS LEFT ${incoming}`, W - 10, H - 10);
    }
    // wave banner
    if (S && S.banner && now - S.bannerAt < 2.5) {
      const k = clamp(2.5 - (now - S.bannerAt), 0, 1);
      c.fillStyle = alpha(C.ground, .75 * k); c.fillRect(0, H * .4, W, H * .17);
      c.fillStyle = alpha(C.amber, k); c.font = `800 ${Math.round(W * .1)}px "Saira Condensed", sans-serif`; c.textAlign = 'center';
      c.fillText(S.banner, W / 2, H * .5);
      c.fillStyle = alpha(C.ink, k); c.font = `500 ${Math.round(W * .03)}px "IBM Plex Sans", sans-serif`;
      c.fillText(`${S.toSpawn} contacts incoming`, W / 2, H * .54);
    }
    // damage vignette
    if (S && S.hitT && now - S.hitT < .35) {
      const k = 1 - (now - S.hitT) / .35;
      const vg = c.createRadialGradient(W / 2, H / 2, W * .3, W / 2, H / 2, W * .75);
      vg.addColorStop(0, alpha(C.hostile, 0)); vg.addColorStop(1, alpha(C.hostile, .35 * k));
      c.fillStyle = vg; c.fillRect(0, 0, W, H);
    }
  }

  // ---------- simulation ----------
  function step(dt) {
    S.t += dt;
    if (S.phase === 'intermission' && S.t >= S.phaseEnd) { S.phase = 'fight'; S.nextSpawn = S.t + .5; }
    if (S.phase === 'fight') {
      const scale = 1 - .05 * (S.wave - 1);
      if (S.toSpawn > 0 && S.t >= S.nextSpawn) {
        if (S.groups.filter(live).length < D.max && spawnGroup()) S.toSpawn--;
        S.nextSpawn = S.t + rand(D.gap[0], D.gap[1]) * scale;
      }
      if (S.toSpawn === 0 && !S.groups.some(live)) {
        if (S.wave >= WAVES) { S.won = true; endRun(); return; }
        S.hp = Math.min(100, S.hp + 20);
        log('sys', 'SYS', `Wave ${S.wave} cleared. +20 HP.`);
        startWave(S.wave + 1);
      }
    }
    S.groups.forEach(g => {
      if (!g.called && !g.warned && live(g) && S.t - g.spawnT > 6) { g.warned = true; log('sys', 'SYS', `Uncalled contact ${g.zone.toUpperCase()} is hitting you.`); }
      g.enemies.forEach(e => {
        if (e.ducked) {
          if (S.t - e.duckAt >= D.heal) {
            // Escaped: back to full health and firing fast, but it only ducks once, so the wave can always be finished.
            e.ducked = false; e.tough = false; e.angry = true; e.hp = MAX_HP; e.fireCd = rand(.8, 1.5); S.stats.oneShotEscapes++;
            S.flashes.push({ x: e.x, y: e.y, t: S.t, text: 'HEALED', c: C.hostile });
            log('sys', 'SYS', `The one-shot ${g.zone.toUpperCase()} healed up. Call "one shot ${g.zone}" faster.`);
          }
          return;
        }
        e.fireCd -= dt;
        if (e.fireCd <= 0) {
          e.firedAt = S.t; e.fireCd = e.angry ? rand(1.6, 2.4) : g.called ? rand(4, 6) : rand(2.4, 3.8); S.hp -= D.dmg; S.hitT = S.t;
          S.shots.push({ x0: e.x, y0: e.y, x1: PLAYER.x + rand(-.02, .02), y1: PLAYER.y, t: S.t, c: C.hostile });
        }
      });
    });
    bots.forEach(b => {
      const g = b.task && live(b.task) ? b.task : null;
      if (!g && b.mode === 'task') b.mode = 'home';
      const dest = g ? ZONES[g.zone].post : (b.mode === 'hold' ? { x: b.x, y: b.y } : b.home);
      const d = Math.hypot(dest.x - b.x, dest.y - b.y), sp = .45 * dt;
      if (d > .005) { b.x += (dest.x - b.x) / d * Math.min(sp, d); b.y += (dest.y - b.y) / d * Math.min(sp, d); }
      b.cd -= dt;
      if (g && d < .03 && b.cd <= 0) {
        const targets = g.enemies.filter(e => !e.ducked).sort((a, z) => a.hp - z.hp);
        if (targets.length) { b.cd = 0.7; botShoot(b, g, targets[0], 1); }
      }
    });
    S.groups = S.groups.filter(live);
    S.shots = S.shots.filter(s => S.t - s.t < .3);
    S.flashes = S.flashes.filter(f => S.t - f.t < 1.1);
    S.sparks = S.sparks.filter(p => S.t - p.t < .4);
    if (S.hp <= 0) endRun();
  }
  let last = 0;
  function loop(ts) {
    if (!S.running) return;
    const dt = Math.min(.05, (ts - (last || ts)) / 1000); last = ts;
    if (!S.paused) { step(dt); hud(); draw(); }
    if (S.running) requestAnimationFrame(loop);
  }
  function hud() {
    const hp = Math.max(0, S.hp), fill = document.getElementById('hpFill');
    fill.style.width = hp + '%';
    fill.style.background = hp > 50 ? 'var(--good)' : hp > 25 ? 'var(--amber)' : 'var(--hostile)';
    document.getElementById('waveOut').textContent = `${Math.max(1, S.wave)}/${WAVES}`;
    document.getElementById('scoreOut').textContent = S.score;
  }

  // ---------- report card (pure scoring) ----------
  function grade(st) {
    const c = st.callouts, n = c.length;
    const avg = n ? c.reduce((a, x) => a + x.reaction, 0) / n : null;
    // Reaction is measured from spawn to the end of your sentence, so ~2 s is excellent once speaking time is included.
    const speed = avg === null ? 0 : Math.min(1, Math.max(0, (5 - avg) / 3));
    const countAcc = n ? c.filter(x => x.countRight).length / n : 0;
    const complete = n ? c.filter(x => x.hasCount && x.hasAction).length / n : 0;
    const coverage = st.groupsTotal ? st.groupsCalled / st.groupsTotal : 0;
    const osTotal = st.oneShotCalls + st.oneShotEscapes;
    const oneShot = osTotal ? st.oneShotCalls / osTotal : 1;
    const per = Math.max(1, st.wavesPlayed || 1);
    const comp = Math.max(0, .3 * speed + .25 * countAcc + .1 * complete + .2 * coverage + .15 * oneShot + .02 * Math.min(st.multi / per, 3) - .06 * (st.wrong + st.lockedShots) / per - .04 * st.vague / per);
    const letter = comp >= .85 ? 'A' : comp >= .7 ? 'B' : comp >= .55 ? 'C' : comp >= .4 ? 'D' : 'F';
    const weak = [
      [coverage, 'Some contacts were never called. Scan all three sectors and call the moment you see one.'],
      [countAcc, 'Say the count every time. "Two left" tells your squad far more than "left".'],
      [speed, `Call first, aim second. Your average was ${avg === null ? '-' : avg.toFixed(1)} s; aim for under 2.5 s.`],
      [complete, 'Add what you are doing: "two left, engaging" tells the squad the plan.'],
      [oneShot, 'Enemies at 1 HP ducked and healed. Call "one shot left" so the squad finishes them.']
    ].sort((a, b) => a[0] - b[0]);
    let tip = weak[0][1];
    if (st.vague / per >= 1) tip = 'Several calls had no sector. Every count and order needs a place: "two left", "push right".';
    if (st.lockedShots / per >= 1) tip = `You tried to shoot ${st.lockedShots} locked enemies. Callout before trigger.`;
    if (!n) tip = 'No callouts landed. Start with "one left" and build from there.';
    return { letter, avg, countAcc, complete, coverage, oneShot, tip };
  }
  window.gradeRound = grade;

  // ---------- screens ----------
  const overlay = document.getElementById('overlay'), card = document.getElementById('card'), pauseBtn = document.getElementById('pauseBtn');
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const btn = (cls, text, fn) => { const b = el('button', cls, text); b.type = 'button'; b.addEventListener('click', fn); return b; };
  function diffPicker() {
    const wrap = el('div', 'diff');
    const row = el('div', 'diff-row'); row.setAttribute('role', 'radiogroup'); row.setAttribute('aria-label', 'Difficulty');
    const note = el('p', 'diff-note', D.note);
    Object.entries(DIFFS).forEach(([k, v]) => {
      const b = btn('chip', v.label, () => {
        diffKey = k; D = DIFFS[k]; note.textContent = v.note; store.set('squadcallout.diff', k);
        row.querySelectorAll('button').forEach(x => { const on = x === b; x.setAttribute('aria-checked', String(on)); x.setAttribute('aria-pressed', String(on)); });
      });
      b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', String(k === diffKey)); b.setAttribute('aria-pressed', String(k === diffKey));
      row.append(b);
    });
    wrap.append(row, note);
    return wrap;
  }
  function continueButton(primary) {
    const sv = loadSave();
    if (!sv) return null;
    return btn(primary ? 'primary' : 'secondary', `Continue wave ${sv.wave}`, () => startRun(sv));
  }
  function showMenu() {
    card.innerHTML = '';
    card.append(el('h2', '', 'No callout, no shot'));
    const p1 = el('p'); p1.innerHTML = 'Every enemy spawns <strong>locked</strong>. Call it with a <strong>count</strong> and a <strong>sector</strong> to unlock it and send your squad.';
    const p2 = el('p', 'example', '"Two left, engaging. One right."');
    const p3 = el('p'); p3.innerHTML = 'Tough enemies <strong>duck at 1 HP</strong> and heal. Call <strong>"one shot left"</strong> and the squad finishes them. Use names to give orders: <strong>"Brick, two front"</strong>.';
    const p4 = el('p'); p4.innerHTML = `Survive <strong>${WAVES} waves</strong>. Progress saves at the start of every wave.`;
    card.append(p1, p2, p3, p4, diffPicker());
    const row = el('div', 'btn-row');
    const sv = loadSave();
    if (sv) {
      row.append(continueButton(true), btn('secondary', 'New drill', () => { store.del(SAVE_KEY); startRun(null); }));
      card.append(row, el('p', 'save-note', `Saved: wave ${sv.wave} \u00b7 ${DIFFS[sv.diff].label} \u00b7 ${sv.score} pts`));
    } else {
      row.append(btn('primary', 'Start drill', () => startRun(null)));
      card.append(row);
    }
    overlay.hidden = false;
  }
  function showPause() {
    card.innerHTML = '';
    card.append(el('h2', '', `Paused \u00b7 wave ${S.wave}`));
    card.append(el('p', '', `HP ${Math.max(0, Math.round(S.hp))} \u00b7 ${S.score} pts. Your progress is saved from the start of wave ${S.wave}.`));
    const row = el('div', 'btn-row');
    row.append(btn('primary', 'Resume', resume), btn('secondary', 'Quit to menu', () => { S.running = false; S.paused = false; pauseBtn.disabled = true; if (mic.on) mic.set(false, true); showMenu(); }));
    card.append(row);
    overlay.hidden = false;
    row.querySelector('button').focus();
  }
  function pause() {
    if (!S || !S.running || S.paused) return;
    S.paused = true; pauseBtn.textContent = '\u25b6'; pauseBtn.setAttribute('aria-label', 'Resume');
    if (mic.on) mic.set(false, true);
    draw(); showPause();
  }
  function resume() {
    if (!S || !S.paused) return;
    S.paused = false; last = 0; overlay.hidden = true; pauseBtn.textContent = 'II'; pauseBtn.setAttribute('aria-label', 'Pause');
    if (mic.wanted && !mic.on) mic.set(true);
  }
  pauseBtn.addEventListener('click', () => (S && S.paused ? resume() : pause()));
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  function endRun() {
    S.running = false; S.over = true; pauseBtn.disabled = true; draw(); hud();
    if (mic.on) mic.set(false, true);
    if (S.won) store.del(SAVE_KEY);
    const r = grade(S.stats), pct = v => Math.round(v * 100) + '%';
    card.innerHTML = '';
    card.append(el('h2', '', (S.won ? 'All waves cleared' : `Squad down \u00b7 wave ${S.wave}`) + ' \u00b7 ' + D.label));
    card.append(el('div', 'grade', r.letter));
    const dl = el('dl', 'stats');
    [['Score', S.score], ['Waves', `${S.won ? WAVES : S.wave - 1} of ${WAVES} cleared`], ['Contacts called', `${S.stats.groupsCalled} of ${S.stats.groupsTotal}`], ['Avg reaction', r.avg === null ? '-' : r.avg.toFixed(1) + ' s'],
     ['Count accuracy', pct(r.countAcc)], ['Full callouts', pct(r.complete)], ['One-shots called', `${S.stats.oneShotCalls} of ${S.stats.oneShotCalls + S.stats.oneShotEscapes}`],
     ['Multi-contact calls', S.stats.multi], ['Orders by name', S.stats.named], ['Calls with no sector', S.stats.vague], ['Missed chances to combine', S.stats.missedCombo],
     ['Wrong sector calls', S.stats.wrong], ['Shots at locked', S.stats.lockedShots]]
      .forEach(([k, v]) => dl.append(el('dt', '', k), el('dd', '', String(v))));
    card.append(dl, el('p', 'tip', r.tip), diffPicker());
    const row = el('div', 'btn-row');
    const cont = !S.won && continueButton(true);
    if (cont) { cont.textContent = `Retry wave ${loadSave().wave}`; row.append(cont); }
    row.append(btn(cont ? 'secondary' : 'primary', 'New drill', () => { store.del(SAVE_KEY); startRun(null); }));
    card.append(row);
    overlay.hidden = false;
  }
  function startRun(save) {
    if (save) { diffKey = save.diff; D = DIFFS[diffKey]; }
    S = freshState(save ? { hp: Math.max(40, save.hp), score: save.score, stats: Object.assign(newStats(), save.stats) } : null);
    S.running = true; last = 0;
    logEl.innerHTML = '';
    overlay.hidden = true; pauseBtn.disabled = false; pauseBtn.textContent = 'II';
    startWave(save ? save.wave : 1);
    hud(); requestAnimationFrame(loop);
    if (mic.wanted && !mic.on) mic.set(true);
  }

  // ---------- firing ----------
  cv.addEventListener('pointerdown', ev => {
    if (!S || !S.running || S.paused) return;
    const rect = cv.getBoundingClientRect();
    const nx = (ev.clientX - rect.left) / rect.width, ny = (ev.clientY - rect.top) / rect.height;
    let best = null, bd = .06;
    S.groups.forEach(g => g.enemies.forEach(e => { if (e.ducked) return; const d = Math.hypot((e.x - nx) * W / H, e.y - ny); if (d < bd) { bd = d; best = { g, e }; } }));
    if (!best) return;
    if (!best.g.called) { S.stats.lockedShots++; S.flashes.push({ x: best.e.x, y: best.e.y, t: S.t, text: 'LOCKED - CALL IT', c: C.hostile }); return; }
    S.shots.push({ x0: PLAYER.x, y0: PLAYER.y, x1: best.e.x, y1: best.e.y, t: S.t, c: C.amber });
    hitEnemy(best.g, best.e, 1, PLAYER.x, PLAYER.y);
  });

  // ---------- typed + pad ----------
  document.getElementById('typeForm').addEventListener('submit', ev => {
    ev.preventDefault();
    const inp = document.getElementById('typeIn');
    handleUtterance(inp.value); inp.value = '';
  });
  let padCount = 'two';
  document.querySelectorAll('[data-count]').forEach(b => b.addEventListener('click', () => {
    padCount = b.dataset.count;
    document.querySelectorAll('[data-count]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  }));
  document.querySelectorAll('[data-zone]').forEach(b => b.addEventListener('click', () => {
    handleUtterance(padCount === 'oneshot' ? `one shot ${b.dataset.zone}` : `${padCount} ${b.dataset.zone}, engaging`);
  }));

  // ---------- open mic ----------
  const talk = document.getElementById('talkBtn'), micStatus = document.getElementById('micStatus');
  const status = t => { micStatus.textContent = t; };
  const mic = { on: false, wanted: false, set: () => {} };
  const paint = () => {
    talk.classList.toggle('on', mic.on);
    talk.setAttribute('aria-pressed', String(mic.on));
    talk.innerHTML = mic.on ? 'MIC<br>ON' : 'MIC<br>OFF';
  };
  const Cap = window.Capacitor;
  const NativeSR = Cap && Cap.isNativePlatform && Cap.isNativePlatform() && Cap.Plugins && Cap.Plugins.SpeechRecognition;
  const WebSR = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (NativeSR) {
    // Installed app: Android listens for one phrase at a time, so loop it while the mic is on.
    let looping = false, permOK = false;
    const runLoop = async () => {
      if (looping) return; looping = true;
      while (mic.on) {
        status('Listening... call contacts any time.');
        try {
          const r = await NativeSR.start({ language: 'en-US', maxResults: 1, partialResults: false, popup: false });
          const said = r && r.matches && r.matches[0];
          if (said && mic.on) handleUtterance(said, true);
        } catch (e) {
          const m = String((e && e.message) || e || '').toLowerCase();
          if (m.includes('permission')) { mic.on = false; mic.wanted = false; paint(); status('Microphone permission is off. Allow it in Settings > Apps > Squad Callout.'); break; }
          await sleep(80);
        }
      }
      looping = false;
      if (!mic.on && !/permission/i.test(micStatus.textContent)) status('Mic off. Tap MIC to open it.');
    };
    mic.set = async (on, auto) => {
      if (on && !permOK) {
        try {
          const st = await NativeSR.requestPermissions();
          if (!st || st.speechRecognition !== 'granted') { status('Microphone permission is off. Allow it in Settings > Apps > Squad Callout.'); return; }
          permOK = true;
        } catch (e) { status('Couldn\u2019t ask for the microphone. Check the app\u2019s permissions in Settings.'); return; }
      }
      mic.on = on; if (!auto) mic.wanted = on; paint();
      if (on) runLoop(); else { try { await NativeSR.stop(); } catch (e) {} }
    };
  } else if (WebSR && window.isSecureContext) {
    const rec = new WebSR();
    rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 1;
    rec.onresult = ev => {
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const t = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) handleUtterance(t, true);
        else document.getElementById('heard').textContent = 'Hearing: ' + t;
      }
    };
    rec.onerror = ev => {
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed' || ev.error === 'audio-capture') {
        mic.on = false; mic.wanted = false; paint();
        status('The browser blocked the mic for this page. Allow Microphone in the site permissions, then reload.');
      }
    };
    rec.onend = () => { if (mic.on) setTimeout(() => { try { rec.start(); } catch (e) {} }, 50); };
    mic.set = async (on, auto) => {
      if (on) {
        try { const s = await navigator.mediaDevices.getUserMedia({ audio: true }); s.getTracks().forEach(t => t.stop()); }
        catch (e) { status('The browser blocked the mic for this page. Allow Microphone in the site permissions, then reload.'); return; }
      }
      mic.on = on; if (!auto) mic.wanted = on; paint();
      if (on) { try { rec.start(); } catch (e) {} status('Listening... call contacts any time.'); }
      else { try { rec.stop(); } catch (e) {} status('Mic off. Tap MIC to open it.'); }
    };
  } else {
    talk.disabled = true;
    status('Voice isn\u2019t available here. Use the callout pad or type, or install the app for voice.');
  }
  talk.addEventListener('click', () => mic.set(!mic.on));

  // ---------- boot: sample frame behind the briefing ----------
  S = freshState();
  S.groups = [
    { zone: 'left', count: 2, spawnT: 0, called: false, enemies: [{ x: .14, y: .30, hp: 3, fireCd: 9 }, { x: .23, y: .44, hp: 3, fireCd: 9 }] },
    { zone: 'front', count: 2, spawnT: 0, called: true, enemies: [{ x: .46, y: .2, hp: 2, fireCd: 9 }, { x: .57, y: .24, hp: 1, ducked: true, duckAt: -1, fireCd: 9 }] }
  ];
  showMenu();
  window.addEventListener('resize', resize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
  resize();
})();
</script>
