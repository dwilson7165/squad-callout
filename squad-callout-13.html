<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Squad Callout Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one tactical column &mdash; HUD strip, radar field, comms console below. Single committed dark "night-ops" look. */
:root {
  color-scheme: dark;
  --ground: #0f1519;
  --panel: #161f25;
  --line: #26343d;
  --grid: #1c2830;
  --ink: #e4ebe8;
  --muted: #8b9ea4;
  --amber: #f0a83a;
  --teal: #4fc2b4;
  --hostile: #e8625a;
  --locked: #6d4a4a;
  --good: #6fcf8a;
  --display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ground); color: var(--ink); }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 16px 32px; padding-inline: 16px; display: flex; flex-direction: column; gap: 12px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: .04em; text-transform: uppercase; margin: 0; line-height: 1; }
h1 span { color: var(--amber); }
.tag { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.hud { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.hp { display: flex; align-items: center; gap: 8px; min-width: 0; }
.hp-bar { flex: 1; height: 8px; background: var(--grid); border-radius: 4px; overflow: hidden; }
.hp-fill { height: 100%; width: 100%; background: var(--good); transition: width .2s, background .2s; }
.hud b { color: var(--amber); font-weight: 500; }
.field { position: relative; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--ground); }
canvas { display: block; width: 100%; touch-action: manipulation; cursor: crosshair; }
.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: color-mix(in srgb, var(--ground) 78%, transparent); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; max-width: 400px; width: 100%; display: flex; flex-direction: column; gap: 10px; max-height: 100%; overflow-y: auto; }
.card h2 { font-family: var(--display); font-size: 24px; text-transform: uppercase; letter-spacing: .05em; margin: 0; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); font-size: 14px; }
.card p strong { color: var(--ink); font-weight: 600; }
.example { font-family: var(--mono); color: var(--amber); font-size: 14px; }
.grade { font-family: var(--display); font-size: 64px; font-weight: 800; line-height: 1; color: var(--amber); }
.stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; font-size: 14px; font-variant-numeric: tabular-nums; }
.stats dt { color: var(--muted); }
.stats dd { margin: 0; font-family: var(--mono); text-align: right; }
.tip { border-left: 3px solid var(--amber); padding-left: 10px; color: var(--ink) !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.primary { background: var(--amber); color: #1a1206; border: 0; border-radius: 8px; padding: 12px 16px; font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; }
.heard { font-family: var(--mono); font-size: 13px; color: var(--muted); min-height: 1.4em; overflow-wrap: anywhere; }
.heard em { color: var(--amber); font-style: normal; }
.console { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: stretch; }
.talk { width: 92px; min-height: 92px; border-radius: 50%; border: 2px solid var(--amber); background: transparent; font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: .1em; color: var(--amber); user-select: none; -webkit-user-select: none; touch-action: none; align-self: center; }
.talk.live { background: var(--amber); color: #1a1206; }
.talk:disabled { opacity: .35; cursor: not-allowed; }
.side { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mic-status { font-size: 12px; color: var(--muted); }
form { display: flex; gap: 8px; }
input[type=text] { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); padding: 10px 12px; font-family: var(--mono); font-size: 14px; }
.send { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 0 14px; }
.pad { display: flex; flex-direction: column; gap: 6px; }
.pad-label { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 4px; font-family: var(--display); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 15px; }
.chip[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.log { list-style: none; margin: 0; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; font-family: var(--mono); font-size: 13px; display: flex; flex-direction: column; gap: 4px; min-height: 120px; }
.log li { overflow-wrap: anywhere; }
.log .who { display: inline-block; min-width: 4.5em; letter-spacing: .06em; }
.log .you .who { color: var(--amber); }
.log .bot .who { color: var(--teal); }
.log .sys .who { color: var(--hostile); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
@media (max-width: 420px) { .talk { width: 78px; min-height: 78px; font-size: 15px; } h1 { font-size: 26px; } }
@media (prefers-reduced-motion: reduce) { .hp-fill { transition: none; } }
.roster { font-size: 13px; color: var(--muted); }
.roster b { color: var(--teal); font-family: var(--display); letter-spacing: .08em; font-size: 15px; }
.talk.on { background: var(--amber); color: #1a1206; }
.talk.busy { border-style: dashed; }
.log .coach .who { color: var(--good); }
.diff { display: flex; flex-direction: column; gap: 6px; }
.diff-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 6px; }
.chapter-tag { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; color: var(--teal); }
.help-h { font-family: var(--display); text-transform: uppercase; letter-spacing: .05em; font-size: 18px; margin: 8px 0 0; }
.diff-note { font-size: 13px !important; min-height: 1.4em; }
.hud { grid-template-columns: 1fr auto auto auto; }
.pause-btn { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-family: var(--display); font-weight: 700; letter-spacing: .08em; font-size: 14px; }
.pause-btn:disabled { opacity: .4; cursor: default; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn-row .primary { flex: 1 1 160px; }
.secondary { flex: 1 1 140px; background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 11px 14px; font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: .08em; text-transform: uppercase; }
.save-note { font-family: var(--mono); font-size: 12px !important; color: var(--muted); }
.row4 { grid-template-columns: repeat(4, 1fr) !important; }
.hud { grid-template-columns: 1fr auto auto auto auto; }
.field { background: #1d2124; }
.tut { background: var(--panel); border: 1px solid var(--amber); border-radius: 8px; padding: 10px 12px; font-size: 15px; line-height: 1.4; }
.tut b { color: var(--amber); font-family: var(--mono); font-weight: 500; }
.cheat { display: grid; grid-template-columns: 1fr; gap: 2px; margin: 0; }
.cheat dt { font-family: var(--mono); color: var(--amber); font-size: 13px; }
.cheat dd { margin: 0 0 6px; color: var(--muted); font-size: 13px; }
.steps { margin: 0; padding-left: 20px; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.steps strong { color: var(--ink); }
.rec-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.rec-table th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 6px 4px 0; border-bottom: 1px solid var(--line); }
.rec-table td { padding: 4px 6px 4px 0; border-bottom: 1px solid var(--line); }
.spark { width: 100%; height: 64px; display: block; }
.credits { font-family: var(--display); font-size: 20px; letter-spacing: .06em; color: var(--amber); }
.screen { position: fixed; inset: 0; z-index: 20; background: var(--ground); overflow-y: auto; padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); }
.screen-inner { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 40px; display: flex; flex-direction: column; gap: 12px; }
.screen-head { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; background: var(--ground); padding-block: 12px 8px; z-index: 1; border-bottom: 1px solid var(--line); }
.screen-head h2 { font-family: var(--display); text-transform: uppercase; letter-spacing: .05em; margin: 0; flex: 1; font-size: 24px; }
.screen-head .credits { font-size: 16px; }
.back { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-family: var(--display); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.slot { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; }
.slot-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); }
.field-row { display: grid; grid-template-columns: 64px 1fr auto; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.field-row > :nth-child(2) { min-width: 0; }
.screen select, .screen input[type=text] { width: 100%; background: var(--ground); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font: inherit; font-size: 15px; }
.mini { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-family: var(--mono); font-size: 12px; color: var(--teal); }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.warn { font-size: 12px; color: var(--hostile); margin: 0; }
.okay { font-size: 12px; color: var(--good); margin: 0; }
.items { display: flex; flex-direction: column; gap: 8px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.item h3 { margin: 0; font-family: var(--display); font-size: 18px; letter-spacing: .04em; text-transform: uppercase; }
.item p { margin: 0; grid-column: 1; color: var(--muted); font-size: 13px; }
.gun-art { display: block; width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--line); }
.item .gun-art { grid-column: 1 / -1; }
.stats-bars { grid-column: 1; display: grid; grid-template-columns: 76px 1fr; gap: 3px 8px; align-items: center; font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.bar { height: 6px; background: var(--grid); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--amber); }
.traits { grid-column: 1; display: flex; flex-wrap: wrap; gap: 4px; }
.trait { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--teal); color: var(--teal); }
.item.gun { grid-template-columns: 1fr auto; }
.item.gun > * { grid-column: 1 / -1; }
.item.gun .gun-art { grid-row: 1; }
.item.gun h3 { grid-row: 2; grid-column: 1; }
.item.gun .buy, .item.gun .owned { grid-row: 2; grid-column: 2; }
.item.gun .tagline { grid-row: 3; }
.item.gun .stats-bars { grid-column: 1 / -1; }
.item.gun { gap: 8px 12px; }
.item .tagline { font-family: var(--mono); font-size: 11px; color: var(--teal); letter-spacing: .06em; }
.buy { grid-row: 1 / span 3; grid-column: 2; background: var(--amber); color: #1a1206; border: 0; border-radius: 8px; padding: 10px 12px; font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.buy:disabled { background: var(--line); color: var(--muted); cursor: default; }
.owned { grid-row: 1 / span 3; grid-column: 2; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--good); }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--panel); border: 1px solid var(--good); color: var(--ink); border-radius: 8px; padding: 10px 14px; font-size: 14px; z-index: 30; }
/* ---------- in-game chrome ---------- */
.toggles { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.wrap header h1 { font-size: 24px; }
.hud { background: linear-gradient(90deg, rgba(22,31,37,.98), rgba(22,31,37,.55)); border-left: 3px solid var(--amber); padding: 8px 10px; border-radius: 2px 8px 8px 2px; }
.hp-bar { position: relative; height: 10px; border-radius: 2px; transform: skewX(-14deg); }
.hp-bar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), rgba(15,21,25,.95) calc(10% - 2px) 10%); }
.field { box-shadow: 0 0 0 1px rgba(240,168,58,.12), 0 14px 40px rgba(0,0,0,.55); }
.field::before, .field::after { content: ""; position: absolute; width: 18px; height: 18px; z-index: 3; pointer-events: none; border: 2px solid var(--amber); opacity: .8; }
.field::before { left: 4px; top: 4px; border-right: 0; border-bottom: 0; }
.field::after { right: 4px; bottom: 4px; border-left: 0; border-top: 0; }
.talk.on { box-shadow: 0 0 0 6px rgba(240,168,58,.16), 0 0 26px rgba(240,168,58,.55); }
.log { background: linear-gradient(180deg, #121a1f, #0f1519); }
.log li { padding: 2px 0 2px 8px; border-left: 2px solid var(--line); }
.log li.you { border-left-color: var(--amber); }
.log li.bot { border-left-color: var(--teal); }
.log li.sys { border-left-color: var(--hostile); }
.log li.coach { border-left-color: var(--good); }
.chip { transition: border-color .12s, color .12s, background .12s; }
.chip:active, .primary:active, .secondary:active, .menu-item:active { transform: translateY(1px); }
.primary { box-shadow: 0 6px 18px rgba(240,168,58,.25); }
/* ---------- title screen ---------- */
#keyart { position: fixed; inset: 0; width: 100vw; height: 100vh; display: none; z-index: 14; pointer-events: none; }
body.title-mode #keyart { display: block; }
body.title-mode { overflow: hidden; }
body.title-mode #overlay { position: fixed; inset: 0; z-index: 15; background: linear-gradient(180deg, rgba(5,8,10,.55) 0%, rgba(5,8,10,0) 34%, rgba(5,8,10,0) 62%, rgba(5,8,10,.75) 100%); align-items: stretch; justify-content: flex-start; padding: calc(env(safe-area-inset-top, 0px) + 22px) 20px calc(env(safe-area-inset-bottom, 0px) + 18px); }
body.title-mode .card { background: transparent; border: 0; padding: 0; max-width: 480px; gap: 12px; max-height: none; overflow: visible; height: 100%; }
.card .logo, .logo { font-family: var(--display); font-weight: 800; text-transform: uppercase; line-height: .86; margin: 0; letter-spacing: .02em; font-size: clamp(52px, 17vw, 84px); text-shadow: 0 3px 0 rgba(0,0,0,.6), 0 0 28px rgba(0,0,0,.6); }
.logo span { display: block; color: var(--amber); text-shadow: 0 3px 0 rgba(0,0,0,.6), 0 0 26px rgba(240,140,40,.45); }
.logo-sub { font-family: var(--mono); font-size: 11px; letter-spacing: .32em; color: #d7c6ad; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
.logo-sub::before { content: ""; width: 28px; height: 2px; background: var(--amber); }
.menu { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.menu-item { text-align: left; background: transparent; border: 0; border-left: 3px solid transparent; padding: 6px 14px; font-family: var(--display); font-weight: 700; font-size: 25px; letter-spacing: .06em; text-transform: uppercase; color: #e9e4dc; text-shadow: 0 2px 6px rgba(0,0,0,.9); display: flex; align-items: baseline; gap: 10px; }
.menu-item small { font-family: var(--mono); font-size: 11px; font-weight: 400; letter-spacing: .12em; color: #c4b49c; }
.menu-item:hover, .menu-item:focus-visible { border-left-color: var(--amber); background: linear-gradient(90deg, rgba(240,168,58,.28), rgba(240,168,58,0) 85%); outline: none; }
.menu-item.hero { color: var(--amber); font-size: 32px; border-left-color: var(--amber); background: linear-gradient(90deg, rgba(240,168,58,.22), rgba(240,168,58,0) 85%); }
.title-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; background: rgba(6,9,11,.72); border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(6px); }
.title-stats { display: flex; justify-content: space-between; gap: 10px; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; color: #c9bba5; text-transform: uppercase; flex-wrap: wrap; }
.title-stats b { color: var(--amber); font-weight: 500; }
body.title-mode .diff-row .chip { padding: 7px 2px; font-size: 14px; background: rgba(20,28,33,.8); }
body.title-mode .diff-note { color: #c9bba5; }
</style>

<div class="wrap">
  <header>
    <h1>Squad <span>Callout</span></h1>
    <div class="tag">Campaign &middot; prototype 0.13</div>
  </header>

  <div class="hud" aria-live="polite">
    <div class="hp"><span>HP</span><div class="hp-bar"><div class="hp-fill" id="hpFill"></div></div></div>
    <div>WAVE <b id="waveOut">1/6</b></div>
    <div>PTS <b id="scoreOut">0</b></div>
    <button class="pause-btn" id="restartBtn" type="button" aria-label="Restart this wave" title="Restart this wave" disabled>&#8635;</button>
    <button class="pause-btn" id="pauseBtn" type="button" aria-label="Pause" disabled>II</button>
  </div>

  <div class="tut" id="tutBox" hidden></div>

  <div class="field">
    <canvas id="cv" aria-label="Top-down street intersection. Hostiles come from the left, front and right."></canvas>
    <div class="overlay" id="overlay">
      <div class="card" id="card"></div>
    </div>
  </div>

  <div class="roster" id="roster"></div>

  <div class="heard" id="heard">Heard: &mdash;</div>

  <div class="console">
    <button class="talk" id="talkBtn" type="button" aria-pressed="false" aria-label="Microphone on or off">MIC<br>OFF</button>
    <div class="side">
      <div class="mic-status" id="micStatus">Tap MIC once. It stays open until you tap it again.</div>
      <form id="typeForm">
        <input type="text" id="typeIn" placeholder="or type: ace and brick four left" autocomplete="off" aria-label="Type a callout">
        <button class="send" type="submit">Call</button>
      </form>
      <div class="toggles"><label class="toggle"><input type="checkbox" id="voiceToggle" checked> Squad talks back</label><label class="toggle"><input type="checkbox" id="sfxToggle" checked> Sound effects</label></div>
    </div>
  </div>

  <div class="pad" aria-label="Callout pad">
    <div class="pad-label">Callout pad &middot; pick a count or one shot, then a sector</div>
    <div class="row row4">
      <button class="chip" type="button" data-count="two" aria-pressed="true">Two</button>
      <button class="chip" type="button" data-count="three" aria-pressed="false">Three</button>
      <button class="chip" type="button" data-count="four" aria-pressed="false">Four</button>
      <button class="chip" type="button" data-count="oneshot" aria-pressed="false">1 Shot</button>
    </div>
    <div class="row">
      <button class="chip" type="button" data-zone="left">Left</button>
      <button class="chip" type="button" data-zone="front">Front</button>
      <button class="chip" type="button" data-zone="right">Right</button>
    </div>
  </div>

  <ul class="log" id="log" aria-live="polite"></ul>
</div>

<section class="screen" id="screen" hidden aria-modal="true" role="dialog" aria-labelledby="screenTitle">
  <div class="screen-inner">
    <div class="screen-head">
      <button class="back" id="screenBack" type="button">&larr; Back</button>
      <h2 id="screenTitle"></h2>
      <span class="credits" id="screenCredits"></span>
    </div>
    <div id="screenBody" style="display:flex;flex-direction:column;gap:12px"></div>
  </div>
</section>
<div class="toast" id="toast" hidden role="status"></div>
<canvas id="keyart" aria-hidden="true"></canvas>

<script>
(() => {
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const C = { ground: css('--ground'), grid: css('--grid'), line: css('--line'), ink: css('--ink'), muted: css('--muted'), amber: css('--amber'), teal: css('--teal'), hostile: css('--hostile'), locked: css('--locked'), good: css('--good'), panel: css('--panel') };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- setup ----------

    { text: `Three on the RIGHT. Throw a grenade: "${C2}, frag right"`, setup: () => { S.groups = S.groups.filter(live); spawnAt('right', 3); }, done: () => S.stats.frags > 0, praise: 'Frag out! Each squadmate has one per wave.' },
    { text: 'You\u2019re down! Call for help: "res me"', setup: () => { S.groups.forEach(g => { g.enemies.length = 0; }); S.pState = 'down'; S.hp = 0; S.pBleed = S.t + 999; }, done: () => S.pState === 'up', praise: 'You\u2019re up. Never go silent when you\u2019re down.' },
    ];
  }
  // Advanced training covers everything added after the basics: classes, utility gear, bosses, airstrikes and checkpoints.
  function makeAdvTut() {
    const medic = bots.find(b => cls(b).heal), sniper = bots.find(b => cls(b).ranged), A = bots[0].name;
    const healer = medic ? 'medic' : bots[1].name;
    const steps = [
      { text: `You\u2019re hurt. Class names work as call signs. Say: "${healer}, heal me"`, setup: () => { S.hp = 45; }, done: () => S.stats.heals > 0, praise: 'Healed. Shouting "medic" on its own works too.' },
      { text: 'Three hostiles RIGHT. Engineers can fortify a street. Say: "barricade right"', setup: () => { spawnAt('right', 3, { hp: 6, called: true }); bots[0].barricades = 1; }, done: () => !!S.barricade.right, praise: 'Sandbags up: that street hits for half.' },
      { text: 'Stun them with a flashbang. Say: "flash right"', setup: () => { S.items.flash = 1; }, done: () => S.groups.some(g => g.stunUntil > S.t), praise: 'Flashed: they can\u2019t shoot for 4 s.' },
      { text: 'Smoke halves their damage. Say: "smoke right"', setup: () => { S.items.smoke = 1; }, done: () => S.groups.some(g => g.smokeUntil > S.t) || !S.groups.some(live), praise: 'Smoke out. Flash, smoke and UAV are Armory gear.' },
      { text: 'Locked group LEFT. A UAV shows how many. Say: "UAV"', setup: () => { S.groups = S.groups.filter(live); spawnAt('left', 3); S.items.uav = 1; }, done: () => S.uavUntil > S.t, praise: 'The count is shown over the street. Recon squadmates do this all the time.' },
      { text: 'Now call it with the count you see: "three left"', done: () => S.groups.filter(g => g.zone === 'left').every(g => g.called), praise: 'Exact count, exact street.' },
      { text: 'Every 10th wave brings a BOSS. It can\u2019t be one-shot. Say: "boss front"', setup: () => { S.groups.forEach(g => { g.enemies.length = 0; }); const g = spawnAt('front', 1, { hp: 12 }); g.boss = true; g.enemies[0].type = 'boss'; g.enemies[0].maxHp = 12; g.enemies[0].x = .5; g.enemies[0].y = .17; }, done: () => S.groups.some(g => g.boss && g.called), praise: 'Boss called.' },
      { text: 'Stack everyone on the boss. Say: "squad, help front"', done: () => S.stats.helps > 0 || !S.groups.some(live), praise: 'Bosses fall fast when the whole squad focuses.' },
      { text: 'Finish the boss. Tap it to add your fire.', done: () => !S.groups.some(live) },
      { text: 'On Hard and Insane you can buy airstrikes. Big group LEFT. Say: "airstrike left"', setup: () => { spawnAt('left', 5, { hp: 9, called: true }); S.airstrikes = 1; }, done: () => S.stats.airstrikes > 0 && !S.groups.some(live), praise: 'Street cleared. One airstrike per chapter.' },
      { text: 'Every 10 waves: a new map, a checkpoint to swap squad and gear, and tougher hostiles. 100 waves in all.', done: () => S.t - S.tut.at > 4 },
      { text: 'The Armory stocks real rifles: M4A1, Mk 18, M27 IAR, M1014, M14 EBR, M249 SAW, M110 and the M107 .50 cal. 7.62 and .50 rounds pierce armor.', done: () => S.t - S.tut.at > 5 }
    ];
    if (sniper) steps.splice(6, 0, { text: `${sniper.name} is your sniper. Hostile ducked FRONT. Say: "sniper, one shot front"`, setup: () => { spawnAt('front', 1, { hp: 1, tough: true, ducked: true, called: true }); }, done: () => !S.groups.some(g => g.zone === 'front' && live(g)), praise: 'Snipers finish one-shots from overwatch.' });
    return steps;
  }
  function tutStep() {
    const T = S.tut, st = S.tutSteps[T.i];
    if (!st) return;
    if (!T.started) { T.started = true; T.at = S.t; if (st.setup) st.setup(); tutShow(st.text); status(st.text.replace(/"/g, '')); }
    if (!T.doneAt && S.t - T.at > .4 && st.done()) { T.doneAt = S.t; if (st.praise) coach(st.praise); }
    if (T.doneAt && S.t - T.doneAt > 1.6) { T.i++; T.started = false; T.doneAt = 0; if (T.i >= S.tutSteps.length) finishTutorial(); }
  }
  function startTutorial(mode) {
    stopRun();
    buildSquad();
    S = freshState(null); S.running = true; S.phase = 'tutorial'; S.wave = 1; S.waveTotal = 0; applyLoadout();
    S.tutMode = mode === 'advanced' ? 'advanced' : 'full';
    S.tutSteps = [...(S.tutMode === 'advanced' ? [] : makeTut()), ...makeAdvTut(), { text: 'Training complete. You know every callout in the game.', done: () => true }];
    S.tut = { i: 0, started: false, doneAt: 0, at: 0 };
    last = 0; logEl.innerHTML = '';
    overlay.hidden = true; titleMode(false); pauseBtn.disabled = false; restartBtn.disabled = true; pauseBtn.textContent = 'II';
    log('sys', 'SYS', 'Tutorial: follow the prompt above the map. Use the mic, the pad or type.');
    hud(); requestAnimationFrame(loop);
    if (mic.wanted && !mic.on) mic.set(true);
  }
  function finishTutorial() {
    store.set(TUT_KEY, '1');
    S.running = false; S.over = true; pauseBtn.disabled = true; hideTut();
    if (mic.on) mic.set(false, true);
    card.innerHTML = ''; titleMode(false);
    card.append(el('h2', '', 'Tutorial complete'));
    card.append(el('p', '', 'You know every callout: contacts, stacking, one-shots, grenades, revives, heals, flash, smoke, UAV, barricades, bosses and airstrikes. Now do it under fire.'));
    card.append(diffPicker());
    const row = el('div', 'btn-row');
    row.append(btn('primary', 'Start drill', () => startRun(null)), btn('secondary', 'Menu', showMenu));
    card.append(row);
    overlay.hidden = false;
  }
  function showPause() {
    card.innerHTML = ''; titleMode(false);
    if (S.tut) {
      card.innerHTML = ''; titleMode(false);
      card.append(el('h2', '', 'Tutorial paused'));
      const tr = el('div', 'btn-row'); tr.append(btn('primary', 'Resume', resume), btn('secondary', 'Quit tutorial', () => { stopRun(); hideTut(); showMenu(); }));
      card.append(tr); overlay.hidden = false; return;
    }
    card.append(el('h2', '', `Paused \u00b7 wave ${S.wave}`));
    card.append(el('p', '', `HP ${Math.max(0, Math.round(S.hp))} \u00b7 ${S.score} pts. Progress is saved from the start of wave ${S.wave}.`));
    const row = el('div', 'btn-row');
    row.append(btn('primary', 'Resume', resume), btn('secondary', `Restart wave ${S.wave}`, restartWave));
    const row2 = el('div', 'btn-row');
    row2.append(btn('secondary', 'New drill', newDrill), btn('secondary', 'Quit to menu', () => { stopRun(); showMenu(); }));
    card.append(row, row2);
    overlay.hidden = false;
    row.querySelector('button').focus();
  }
  function pause() {
    if (!S || !S.running || S.paused) return;
    S.paused = true; pauseBtn.textContent = '\u25b6'; pauseBtn.setAttribute('aria-label', 'Resume');
    if (mic.on) mic.set(false, true);
    draw(); showPause();
  }
  function resume() {
    if (!S || !S.paused) return;
    S.paused = false; last = 0; overlay.hidden = true; titleMode(false); pauseBtn.textContent = 'II'; pauseBtn.setAttribute('aria-label', 'Pause');
    if (mic.wanted && !mic.on) mic.set(true);
  }
  pauseBtn.addEventListener('click', () => (S && S.paused ? resume() : pause()));
  restartBtn.addEventListener('click', () => { if (S && (S.running || S.over)) restartWave(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  function endRun() {
    S.running = false; S.over = true; pauseBtn.disabled = true; draw(); hud();
    restartBtn.disabled = !loadSave();
    if (mic.on) mic.set(false, true);
    if (S.won) store.del(SAVE_KEY);
    hideTut();
    const r = grade(S.stats), pct = v => Math.round(v * 100) + '%';
    bankCredits();
    recordRun({ at: Date.now(), diff: diffKey, chapter: chapterOf(S.wave) + 1, wave: S.won ? WAVES : S.wave, won: S.won, grade: r.letter, score: S.score, react: r.avg === null ? null : +r.avg.toFixed(2) });
    card.innerHTML = ''; titleMode(false);
    card.append(el('h2', '', (S.won ? 'Campaign complete' : `Squad down \u00b7 chapter ${chapterOf(S.wave) + 1}, wave ${S.wave}`) + ' \u00b7 ' + D.label));
    card.append(el('div', 'grade', r.letter));
    card.append(el('div', 'credits', `+${S.creditsRun.toLocaleString()} CREDITS THIS RUN`));
    const dl = el('dl', 'stats');
    [['Score', S.score], ['Wave clear bonuses', `+${S.stats.waveBonus}`], ['Waves', `${S.won ? WAVES : S.wave - 1} of ${WAVES} cleared (${S.stats.flawless} flawless)`], ['Contacts called', `${S.stats.groupsCalled} of ${S.stats.groupsTotal}`], ['Avg reaction', r.avg === null ? '-' : r.avg.toFixed(1) + ' s'],
     ['Count accuracy', pct(r.countAcc)], ['Full callouts', pct(r.complete)], ['One-shots called', `${S.stats.oneShotCalls} of ${S.stats.oneShotCalls + S.stats.oneShotEscapes}`],
     ['Multi-contact calls', S.stats.multi], ['Two or more sent', S.stats.stacked], ['Orders by name', S.stats.named], ['Squad downed', S.stats.botsDowned], ['Revives', `${S.stats.revives} (${S.stats.bleedOuts} bled out)`], ['Bosses killed', S.stats.bossKills], ['Airstrikes', S.stats.airstrikes], ['You went down', S.stats.playerDowns], ['Grenades', `${S.stats.frags} thrown, ${S.stats.fragKills} kills`], ['Calls with no sector', S.stats.vague], ['Missed chances to combine', S.stats.missedCombo],
     ['Wrong sector calls', S.stats.wrong], ['Shots at locked', S.stats.lockedShots]]
      .forEach(([k, v]) => dl.append(el('dt', '', k), el('dd', '', String(v))));
    card.append(dl, el('p', 'tip', r.tip), diffPicker());
    const row = el('div', 'btn-row');
    const sv = !S.won && loadSave();
    if (sv) row.append(btn('primary', `Retry wave ${sv.wave}`, () => startRun(loadSave())));
    row.append(btn(sv ? 'secondary' : 'primary', 'Replay drill', newDrill));
    const row2 = el('div', 'btn-row'); row2.append(btn('secondary', 'Armory', () => showArmory(null)), btn('secondary', 'Menu', showMenu));
    card.append(row, row2);
    overlay.hidden = false;
  }
  function startRun(save) {
    if (save) { diffKey = save.diff; D = DIFFS[diffKey]; }
    buildSquad();
    S = freshState(save ? { hp: Math.max(40, save.hp), score: save.score, banked: save.banked === undefined ? save.score : save.banked, stats: Object.assign(newStats(), save.stats) } : null);
    S.running = true; last = 0; applyLoadout();
    if (save && D.air && owns('gear', 'airstrike')) S.airstrikes = save.airstrikes === undefined ? 1 : save.airstrikes;
    logEl.innerHTML = '';
    overlay.hidden = true; titleMode(false); pauseBtn.disabled = false; restartBtn.disabled = false; pauseBtn.textContent = 'II';
    startWave(save ? save.wave : 1);
    hud(); requestAnimationFrame(loop);
    if (mic.wanted && !mic.on) mic.set(true);
  }

  // ---------- firing ----------
  cv.addEventListener('pointerdown', ev => {
    if (!S || !S.running || S.paused) return;
    if (S.pState === 'down') { const downFor = S.t - (S.pBleed - PLAYER_BLEED); if (downFor >= TAP_RES_AFTER && !bots.some(b => b.mode === 'revive' && b.reviveTarget === 'player')) { handleUtterance('res me'); coach('Tapped for a revive. In a real squad you have to say it: "res me".'); } return; }
    const rect = cv.getBoundingClientRect();
    const nx = (ev.clientX - rect.left) / rect.width, ny = (ev.clientY - rect.top) / rect.height;
    let best = null, bd = .06;
    S.groups.forEach(g => g.enemies.forEach(e => { if (e.ducked) return; const d = Math.hypot((e.x - nx) * W / H, e.y - ny); if (d < bd) { bd = d; best = { g, e }; } }));
    if (!best) return;
    if (!best.g.called) { S.stats.lockedShots++; S.flashes.push({ x: best.e.x, y: best.e.y, t: S.t, text: 'LOCKED - CALL IT', c: C.hostile }); return; }
    S.shots.push({ x0: PLAYER.x, y0: PLAYER.y, x1: best.e.x, y1: best.e.y, t: S.t, c: C.amber });
    { const pw = PLAYER_WEAPONS[getSquad().player] || PLAYER_WEAPONS.m4a1; sfx('shot', pw.kind); hitEnemy(best.g, best.e, (S.pDmg || 1) + apBonus(pw, best.e), PLAYER.x, PLAYER.y, { name: 'You', gun: pw.label.split(' ')[0] }); }
  });

  // ---------- typed + pad ----------
  document.getElementById('typeForm').addEventListener('submit', ev => {
    ev.preventDefault();
    const inp = document.getElementById('typeIn');
    handleUtterance(inp.value); inp.value = '';
  });
  let padCount = 'two';
  document.querySelectorAll('[data-count]').forEach(b => b.addEventListener('click', () => {
    padCount = b.dataset.count;
    document.querySelectorAll('[data-count]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  }));
  document.querySelectorAll('[data-zone]').forEach(b => b.addEventListener('click', () => {
    handleUtterance(padCount === 'oneshot' ? `one shot ${b.dataset.zone}` : `${padCount} ${b.dataset.zone}, engaging`);
  }));

  // ---------- open mic ----------
  const talk = document.getElementById('talkBtn'), micStatus = document.getElementById('micStatus');
  const status = t => { micStatus.textContent = t; };
  const mic = { on: false, wanted: false, set: () => {} };
  const paint = () => {
    talk.classList.toggle('on', mic.on);
    talk.setAttribute('aria-pressed', String(mic.on));
    talk.innerHTML = mic.on ? 'MIC<br>ON' : 'MIC<br>OFF';
  };
  const Cap = window.Capacitor;
  const NativeSR = Cap && Cap.isNativePlatform && Cap.isNativePlatform() && Cap.Plugins && Cap.Plugins.SpeechRecognition;
  const WebSR = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (NativeSR) {
    // Installed app: Android listens for one phrase at a time, so loop it while the mic is on.
    // Each listening session has an id. Pausing or resuming starts a new id, so a session Android never closes can't block the mic.
    let loopGen = 0, permOK = false;
    const listenOnce = () => Promise.race([
      NativeSR.start({ language: 'en-US', maxResults: 1, partialResults: false, popup: false }),
      sleep(15000).then(() => { throw new Error('listen-timeout'); })
    ]);
    const runLoop = async () => {
      const gen = ++loopGen;
      while (mic.on && gen === loopGen) {
        status('Listening... call contacts any time.');
        try {
          const r = await listenOnce();
          if (gen !== loopGen) return;
          const said = r && r.matches && r.matches[0];
          if (said && mic.on) handleUtterance(said, true);
        } catch (e) {
          if (gen !== loopGen) return;
          const m = String((e && e.message) || e || '').toLowerCase();
          if (m.includes('permission')) { mic.on = false; mic.wanted = false; paint(); status('Microphone permission is off. Allow it in Settings > Apps > Squad Callout.'); return; }
          if (m.includes('listen-timeout')) { try { await NativeSR.stop(); } catch (e2) {} }
          await sleep(120);
        }
      }
      if (gen === loopGen && !mic.on && !/permission/i.test(micStatus.textContent)) status('Mic off. Tap MIC to open it.');
    };
    mic.set = async (on, auto) => {
      if (on && !permOK) {
        try {
          const st = await NativeSR.requestPermissions();
          if (!st || st.speechRecognition !== 'granted') { status('Microphone permission is off. Allow it in Settings > Apps > Squad Callout.'); return; }
          permOK = true;
        } catch (e) { status('Couldn\u2019t ask for the microphone. Check the app\u2019s permissions in Settings.'); return; }
      }
      mic.on = on; if (!auto) mic.wanted = on; paint();
      if (on) runLoop(); else { loopGen++; try { await NativeSR.stop(); } catch (e) {} }
    };
  } else if (WebSR && window.isSecureContext) {
    const rec = new WebSR();
    rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 1;
    rec.onresult = ev => {
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const t = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) handleUtterance(t, true);
        else document.getElementById('heard').textContent = 'Hearing: ' + t;
      }
    };
    rec.onerror = ev => {
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed' || ev.error === 'audio-capture') {
        mic.on = false; mic.wanted = false; paint();
        status('The browser blocked the mic for this page. Allow Microphone in the site permissions, then reload.');
      }
    };
    rec.onend = () => { if (mic.on) setTimeout(() => { try { rec.start(); } catch (e) {} }, 50); };
    mic.set = async (on, auto) => {
      if (on) {
        try { const s = await navigator.mediaDevices.getUserMedia({ audio: true }); s.getTracks().forEach(t => t.stop()); }
        catch (e) { status('The browser blocked the mic for this page. Allow Microphone in the site permissions, then reload.'); return; }
      }
      mic.on = on; if (!auto) mic.wanted = on; paint();
      if (on) { try { rec.start(); } catch (e) {} status('Listening... call contacts any time.'); }
      else { try { rec.stop(); } catch (e) {} status('Mic off. Tap MIC to open it.'); }
    };
  } else {
    talk.disabled = true;
    status('Voice isn\u2019t available here. Use the callout pad or type, or install the app for voice.');
  }
  talk.addEventListener('click', () => mic.set(!mic.on));

  // ---------- keep the screen on while the app is open ----------
  let wakeLock = null;
  async function keepAwake() {
    const Cp = window.Capacitor, KA = Cp && Cp.isNativePlatform && Cp.isNativePlatform() && Cp.Plugins && Cp.Plugins.KeepAwake;
    if (KA) { try { await KA.keepAwake(); return; } catch (e) {} }
    try {
      if ('wakeLock' in navigator && !wakeLock && document.visibilityState === 'visible') {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });
  document.addEventListener('pointerdown', keepAwake);
  keepAwake();

  buildSquad();
  // ---------- boot: a sample scene behind the briefing ----------
  S = freshState();
  S.wave = 2; S.waveTotal = 5; S.waveCleared = 2;
  S.groups = [
    { zone: 'left', count: 3, spawnT: 0, called: false, bots: [], enemies: [{ x: .12, y: .30, hp: 3, wob: 0 }, { x: .21, y: .40, hp: 3, wob: 2 }, { x: .14, y: .48, hp: 3, wob: 4 }] },
    { zone: 'front', count: 2, spawnT: 0, called: true, bots: [], enemies: [{ x: .44, y: .14, hp: 2, wob: 1 }, { x: .57, y: .2, hp: 1, ducked: true, duckAt: -1, wob: 3 }] }
  ];
  showMenu();
  window.addEventListener('resize', resize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
  resize();
})();
</script>
